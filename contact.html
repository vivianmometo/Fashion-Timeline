<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="timeline.html">Timeline</a></li>
        <li><a href="trends.html">Trends</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>We'd Love to Hear From You!</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name">
      
      <label for="email">Email:</label>
      <input type="email" id="email">
      
      <label for="message">Message:</label>
      <textarea id="message"></textarea>
      
      <button type="submit">Submit</button>
    </form>
  </main>
  <footer>
    <div class="footer-content">
        <div class="contact-info">
          <h3>Contact Us</h3>
          <p>Email: <a href="fashiontimeline@hotmail.com">fashiontimeline@hotmail.com</a></p>
          <p>Phone: <a href="tel:+1 (555) 123-4567">+1 (555) 123-4567</a></p>
          <p>Location: 123 Fashion St, Istanbul, Turkiye</p>
          <p>&copy; 2025 Fashion Timeline. All Rights Reserved.</p>
        </div>
      </div>
  </footer>
  <script>
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', (event) => {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
    
        if (!name || !email || !message) {
          event.preventDefault();
          alert('Please fill out all fields before submitting.');
        } else {
          alert('Thank you for your message!');
        }
      });
    }
  </script>
  <script src="scripts/script.js"></script>
</body>
</html>
